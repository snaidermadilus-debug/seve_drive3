<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cloud Studio Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <div class="painel-login">
        <div class="auth-icon-header">
            <i class="fa-solid fa-cloud-arrow-up"></i>
        </div>
        <h2>Cloud Studio Pro</h2>
        <p>Acesse seu espaço de armazenamento em nuvem</p>

        {% if erro %}
        <div class="erro">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span>{{ erro }}</span>
        </div>
        {% endif %}

        {% if sucesso %}
        <div class="sucesso">
            <i class="fa-solid fa-circle-check"></i>
            <span>{{ sucesso }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST" class="auth-form">
            <div class="input-icon-group">
                <i class="fa-solid fa-user input-icon"></i>
                <input type="text" name="usuario" placeholder="Nome de usuário" required autocomplete="username" autofocus>
            </div>
            <div class="input-icon-group">
                <i class="fa-solid fa-lock input-icon"></i>
                <input type="password" name="senha" placeholder="Sua senha de acesso" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-primary auth-submit">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar na Conta
            </button>
        </form>

        <div class="link-alternativo">
            Ainda não tem conta? <a href="/cadastro">Criar novo espaço</a>
        </div>
    </div>
</body>
</html>
